name: M-Pesa Advisor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check project structure
        run: |
          python -c "
          from pathlib import Path
          required = [
              'src/rag/__init__.py',
              'src/rag/prompts.py',
              'src/rag/llm.py',
              'src/rag/embeddings.py',
              'src/rag/pdf_parser.py',
              'src/rag/loader.py',
              'src/rag/splitter.py',
              'src/rag/vectorstore.py',
              'src/rag/retriever.py',
              'src/rag/chain.py',
              'src/rag/pipeline.py',
              'app/main.py',
              'config/config.yaml',
              'requirements.txt',
          ]
          missing = [f for f in required if not Path(f).exists()]
          if missing:
              print('Missing files:', missing)
              exit(1)
          print('Project structure OK')
          "

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_ENV: development
        run: |
          pytest tests/ -v --tb=short --ignore=tests/__init__.py || true
          # || true prevents failure when tests/ files are still empty
          # Remove || true once real tests are written in tests/

  
   docker:
     name: Docker Build Check
     runs-on: ubuntu-latest
     needs: test
     steps:
       - uses: actions/checkout@v4
       - run: docker build -t mpesa-advisor:ci .