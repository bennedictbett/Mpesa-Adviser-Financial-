name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          # Jarvis's Groq client is created lazily (backend/agents/jarvis.py
          # get_client()) and every test that touches it mocks the client
          # directly — no real API key is needed for tests to pass. This
          # placeholder exists only so any accidental early import doesn't
          # crash with a bare KeyError before a test even runs.
          GROQ_API_KEY: "not-a-real-key-tests-mock-the-client"
        run: |
          pytest -v